<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc"><title id="title">LOF: 내 주변은 이웃의 주변보다 성긴가?</title><desc id="desc">조밀한 집단 옆의 붉은 점은 이웃에 비해 국소 밀도가 낮다. 성긴 정상 집단 내부의 초록 점은 이웃과 비슷한 밀도라 LOF가 1 근처일 수 있다.</desc><rect width="1000" height="455" fill="#f7f9fc"/><text x="500" y="40" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#26344d" text-anchor="middle" font-weight="700">LOF: 내 주변은 이웃의 주변보다 성긴가?</text><text x="500" y="78" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="19" fill="#26344d" text-anchor="middle" font-weight="400">다른 집단과의 전역 밀도보다 자기 이웃과의 상대적인 밀도를 본다.</text><rect x="40" y="105" width="550" height="245" rx="8" fill="#fff" stroke="#d3dce8"/><circle cx="100.0" cy="165" r="4" fill="#357cb9"/><circle cx="113.0" cy="165" r="4" fill="#357cb9"/><circle cx="126.0" cy="165" r="4" fill="#357cb9"/><circle cx="139.0" cy="165" r="4" fill="#357cb9"/><circle cx="152.0" cy="165" r="4" fill="#357cb9"/><circle cx="165.0" cy="165" r="4" fill="#357cb9"/><circle cx="178.0" cy="165" r="4" fill="#357cb9"/><circle cx="102.5244129544237" cy="178" r="4" fill="#357cb9"/><circle cx="115.5244129544237" cy="178" r="4" fill="#357cb9"/><circle cx="128.5244129544237" cy="178" r="4" fill="#357cb9"/><circle cx="141.5244129544237" cy="178" r="4" fill="#357cb9"/><circle cx="154.5244129544237" cy="178" r="4" fill="#357cb9"/><circle cx="167.5244129544237" cy="178" r="4" fill="#357cb9"/><circle cx="180.5244129544237" cy="178" r="4" fill="#357cb9"/><circle cx="102.72789228047705" cy="191" r="4" fill="#357cb9"/><circle cx="115.72789228047705" cy="191" r="4" fill="#357cb9"/><circle cx="128.72789228047705" cy="191" r="4" fill="#357cb9"/><circle cx="141.72789228047705" cy="191" r="4" fill="#357cb9"/><circle cx="154.72789228047705" cy="191" r="4" fill="#357cb9"/><circle cx="167.72789228047705" cy="191" r="4" fill="#357cb9"/><circle cx="180.72789228047705" cy="191" r="4" fill="#357cb9"/><circle cx="100.4233600241796" cy="204" r="4" fill="#357cb9"/><circle cx="113.4233600241796" cy="204" r="4" fill="#357cb9"/><circle cx="126.4233600241796" cy="204" r="4" fill="#357cb9"/><circle cx="139.4233600241796" cy="204" r="4" fill="#357cb9"/><circle cx="152.4233600241796" cy="204" r="4" fill="#357cb9"/><circle cx="165.4233600241796" cy="204" r="4" fill="#357cb9"/><circle cx="178.4233600241796" cy="204" r="4" fill="#357cb9"/><circle cx="97.72959251407622" cy="217" r="4" fill="#357cb9"/><circle cx="110.72959251407622" cy="217" r="4" fill="#357cb9"/><circle cx="123.72959251407622" cy="217" r="4" fill="#357cb9"/><circle cx="136.72959251407622" cy="217" r="4" fill="#357cb9"/><circle cx="149.72959251407622" cy="217" r="4" fill="#357cb9"/><circle cx="162.72959251407622" cy="217" r="4" fill="#357cb9"/><circle cx="175.72959251407622" cy="217" r="4" fill="#357cb9"/><circle cx="97.12322717601059" cy="230" r="4" fill="#357cb9"/><circle cx="110.12322717601059" cy="230" r="4" fill="#357cb9"/><circle cx="123.12322717601059" cy="230" r="4" fill="#357cb9"/><circle cx="136.12322717601057" cy="230" r="4" fill="#357cb9"/><circle cx="149.12322717601057" cy="230" r="4" fill="#357cb9"/><circle cx="162.12322717601057" cy="230" r="4" fill="#357cb9"/><circle cx="175.12322717601057" cy="230" r="4" fill="#357cb9"/><circle cx="350" cy="145" r="4" fill="#238369"/><circle cx="388" cy="145" r="4" fill="#238369"/><circle cx="426" cy="145" r="4" fill="#238369"/><circle cx="464" cy="145" r="4" fill="#238369"/><circle cx="502" cy="145" r="4" fill="#238369"/><circle cx="350" cy="183" r="4" fill="#238369"/><circle cx="388" cy="183" r="4" fill="#238369"/><circle cx="426" cy="183" r="4" fill="#238369"/><circle cx="464" cy="183" r="4" fill="#238369"/><circle cx="502" cy="183" r="4" fill="#238369"/><circle cx="350" cy="221" r="4" fill="#238369"/><circle cx="388" cy="221" r="4" fill="#238369"/><circle cx="426" cy="221" r="4" fill="#238369"/><circle cx="464" cy="221" r="4" fill="#238369"/><circle cx="502" cy="221" r="4" fill="#238369"/><circle cx="350" cy="259" r="4" fill="#238369"/><circle cx="388" cy="259" r="4" fill="#238369"/><circle cx="426" cy="259" r="4" fill="#238369"/><circle cx="464" cy="259" r="4" fill="#238369"/><circle cx="502" cy="259" r="4" fill="#238369"/><circle cx="350" cy="297" r="4" fill="#238369"/><circle cx="388" cy="297" r="4" fill="#238369"/><circle cx="426" cy="297" r="4" fill="#238369"/><circle cx="464" cy="297" r="4" fill="#238369"/><circle cx="502" cy="297" r="4" fill="#238369"/><circle cx="426" cy="221" r="15" fill="none" stroke="#238369" stroke-width="2"/><circle cx="240" cy="195" r="8" fill="#c34359"/><path d="M240,195 L178,178" fill="none" stroke="#c34359" stroke-width="1" stroke-dasharray="6 5"/><path d="M240,195 L178,191" fill="none" stroke="#c34359" stroke-width="1" stroke-dasharray="6 5"/><path d="M240,195 L178,204" fill="none" stroke="#c34359" stroke-width="1" stroke-dasharray="6 5"/><path d="M240,195 L165,191" fill="none" stroke="#c34359" stroke-width="1" stroke-dasharray="6 5"/><text x="140" y="131" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" fill="#357cb9" text-anchor="middle" font-weight="400">조밀한 정상 집단</text><text x="447" y="328" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" fill="#238369" text-anchor="middle" font-weight="400">성기지만 일정한 정상 집단</text><text x="250" y="260" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" fill="#c34359" text-anchor="middle" font-weight="400">이웃들은 조밀한데</text><text x="250" y="283" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" fill="#c34359" text-anchor="middle" font-weight="400">이 점 주변은 성김</text><rect x="625" y="120" width="335" height="95" rx="8" fill="#fcebed" stroke="none"/><text x="792" y="155" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" fill="#c34359" text-anchor="middle" font-weight="700">붉은 점: LOF가 커질 수 있음</text><text x="792" y="187" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" fill="#26344d" text-anchor="middle" font-weight="400">이웃 밀도 / 내 밀도 비율이 큼</text><rect x="625" y="233" width="335" height="95" rx="8" fill="#e8f6ef" stroke="none"/><text x="792" y="267" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" fill="#238369" text-anchor="middle" font-weight="700">초록 내부 점: LOF ≈ 1 가능</text><text x="792" y="300" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" fill="#26344d" text-anchor="middle" font-weight="400">이웃도 나와 비슷하게 성김</text><text x="500" y="390" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="20" fill="#26344d" text-anchor="middle" font-weight="700">단순히 “전체에서 드문 위치”와 “이웃보다 드문 위치”는 다르다.</text><text x="500" y="424" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" fill="#26344d" text-anchor="middle" font-weight="400">개념도: 실제 LOF 값은 k, 거리, 경계 효과에 따라 달라지며 여기서는 계산한 점수가 아니다.</text></svg>