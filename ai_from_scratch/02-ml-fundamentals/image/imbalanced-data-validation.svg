<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="555" viewBox="0 0 1100 555" role="img" aria-labelledby="title desc"><title id="title">불균형 분류: 누수 없는 학습과 평가</title><desc id="desc">원본 분할 후 훈련 fold에서만 재표본화한다. 검증에서 설정과 임계값을 선택하고 테스트로 최종 평가한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#63758e"/></marker></defs><rect width="1100" height="555" fill="#f7f9fc"/><text x="550" y="43" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="700" fill="#24334b">불균형 분류: 누수 없는 학습과 평가</text><text x="550" y="83" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="400" fill="#24334b">분할을 먼저 하고, 재표본화는 훈련에만 적용한다.</text><rect x="35" y="205" width="170" height="105" rx="12" fill="#e8f1ff" stroke="#c6d2e1"/><text x="120.0" y="250.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">원본 데이터</text><text x="120.0" y="277.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">실제 클래스 비율</text><path d="M205,258 L245,258" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="250" y="105" width="230" height="90" rx="12" fill="#e8f1ff" stroke="#c6d2e1"/><text x="365.0" y="142.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">훈련 fold</text><text x="365.0" y="169.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">전처리 fit + transform</text><rect x="540" y="105" width="225" height="90" rx="12" fill="#fff2df" stroke="#c6d2e1"/><text x="652.5" y="142.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">재표본화</text><text x="652.5" y="169.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">복제·SMOTE·축소</text><rect x="825" y="105" width="230" height="90" rx="12" fill="#e8f6ef" stroke="#c6d2e1"/><text x="940.0" y="142.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">모델 fit</text><text x="940.0" y="169.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">가중치도 검증 대상</text><path d="M480,150 L540,150" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765,150 L825,150" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M240,257 L240,150" stroke="#63758e" stroke-width="2" fill="none"/><path d="M240,150 L250,150" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="250" y="245" width="230" height="90" rx="12" fill="#e8f1ff" stroke="#c6d2e1"/><text x="365.0" y="282.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">검증 fold</text><text x="365.0" y="309.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">훈련 통계로 transform</text><rect x="540" y="245" width="225" height="90" rx="12" fill="#e8f6ef" stroke="#c6d2e1"/><text x="652.5" y="282.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">검증 점수 산출</text><text x="652.5" y="309.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">재표본화하지 않음</text><rect x="825" y="245" width="230" height="90" rx="12" fill="#fff2df" stroke="#c6d2e1"/><text x="940.0" y="282.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">임계값·설정 선택</text><text x="940.0" y="309.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">비용·PR 지표 확인</text><path d="M245,258 L250,258" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,290 L540,290" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765,290 L825,290" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><rect x="250" y="385" width="230" height="90" rx="12" fill="#e8f1ff" stroke="#c6d2e1"/><text x="365.0" y="422.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">테스트 데이터</text><text x="365.0" y="449.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">실제 클래스 비율 유지</text><rect x="540" y="385" width="225" height="90" rx="12" fill="#e8f6ef" stroke="#c6d2e1"/><text x="652.5" y="422.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">고정된 모델로 예측</text><text x="652.5" y="449.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">재표본화하지 않음</text><rect x="825" y="385" width="230" height="90" rx="12" fill="#fff2df" stroke="#c6d2e1"/><text x="940.0" y="422.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">최종 평가</text><text x="940.0" y="449.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">선택한 임계값 적용</text><path d="M240,258 L240,430" stroke="#63758e" stroke-width="2" fill="none"/><path d="M240,430 L250,430" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M480,430 L540,430" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M765,430 L825,430" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="550" y="525" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="400" fill="#24334b">교차검증에서는 이 절차를 fold마다 반복한다. 테스트는 설정 선택에 사용하지 않는다.</text></svg>