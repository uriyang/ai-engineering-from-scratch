<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">이상 탐지: 범위·고립·국소 밀도</title><desc id="desc">Z-score와 IQR은 개별 범위를, Isolation Forest는 고립 경로를, LOF는 이웃 대비 밀도를 평가한다. 설명용 개념도다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#63758e"/></marker></defs><rect width="1100" height="520" fill="#f7f9fc"/><text x="550" y="43" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="700" fill="#24334b">이상 탐지: 범위·고립·국소 밀도</text><text x="550" y="82" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="400" fill="#24334b">같은 관측도 정상의 기준에 따라 다르게 평가된다.</text><rect x="35" y="108" width="310" height="345" rx="12" fill="#ffffff" stroke="#c6d2e1"/><text x="190" y="145" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" fill="#24334b">Z-score / IQR</text><text x="190" y="174" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="400" fill="#24334b">컬럼별 범위</text><rect x="395" y="108" width="310" height="345" rx="12" fill="#ffffff" stroke="#c6d2e1"/><text x="550" y="145" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" fill="#24334b">Isolation Forest</text><text x="550" y="174" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="400" fill="#24334b">고립에 필요한 분할</text><rect x="755" y="108" width="310" height="345" rx="12" fill="#ffffff" stroke="#c6d2e1"/><text x="910" y="145" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="21" font-weight="700" fill="#24334b">LOF</text><text x="910" y="174" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="400" fill="#24334b">이웃과 비교한 밀도</text><rect x="100" y="228" width="140" height="110" fill="#e8f1ff"/><path d="M65,285 L320,285" stroke="#63758e" stroke-width="2" fill="none"/><circle cx="110" cy="285" r="5" fill="#4386c6"/><circle cx="130" cy="285" r="5" fill="#4386c6"/><circle cx="145" cy="285" r="5" fill="#4386c6"/><circle cx="153" cy="285" r="5" fill="#4386c6"/><circle cx="163" cy="285" r="5" fill="#4386c6"/><circle cx="180" cy="285" r="5" fill="#4386c6"/><circle cx="201" cy="285" r="5" fill="#4386c6"/><circle cx="223" cy="285" r="5" fill="#4386c6"/><circle cx="296" cy="285" r="8" fill="#ca5264"/><text x="296" y="264" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="400" fill="#ad3a4c">범위 밖</text><text x="190" y="389" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="400" fill="#24334b">조합 이상은 놓칠 수 있음</text><circle cx="500.0" cy="320.0" r="4" fill="#4386c6"/><circle cx="525.8962809994662" cy="294.36245900186054" r="4" fill="#4386c6"/><circle cx="473.85272682759233" cy="255.00889363208685" r="4" fill="#4386c6"/><circle cx="500.50441701453053" cy="259.5923693529951" r="4" fill="#4386c6"/><circle cx="525.6379672426484" cy="301.3980834955132" r="4" fill="#4386c6"/><circle cx="473.6091272008499" cy="319.1805669004808" r="4" fill="#4386c6"/><circle cx="501.0086914166342" cy="286.8884397196927" r="4" fill="#4386c6"/><circle cx="525.3724049342879" cy="251.8297439254111" r="4" fill="#4386c6"/><circle cx="473.37298899255484" cy="265.365550990047" r="4" fill="#4386c6"/><circle cx="501.51268063420446" cy="307.6658718528857" r="4" fill="#4386c6"/><circle cx="525.0996691560816" cy="316.76063735075684" r="4" fill="#4386c6"/><circle cx="473.14437896540954" cy="279.32599472250985" r="4" fill="#4386c6"/><circle cx="502.0162421757644" cy="250.20378311856646" r="4" f