<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">학습 곡선 패턴</title>
  <desc id="desc">고편향, 고분산, 좋은 적합에서 훈련 오차와 검증 오차가 데이터 크기에 따라 어떻게 달라지는지 비교한다</desc>
  <defs>
    <style>
      .title { font: 700 26px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .label { font: 700 16px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .small { font: 14px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #526078; }
      .panel { fill: #ffffff; stroke: #d7ddea; stroke-width: 1.5; rx: 8; }
      .axis { stroke: #c8d0df; stroke-width: 1.5; }
      .train { stroke: #3b82c4; stroke-width: 3.5; fill: none; }
      .val { stroke: #d98b24; stroke-width: 3.5; fill: none; }
      .gap { stroke: #d96b6b; stroke-width: 2; stroke-dasharray: 6 6; }
    </style>
  </defs>
  <rect width="980" height="430" fill="#f7f8fb"/>
  <text x="490" y="42" text-anchor="middle" class="title">학습 곡선은 더 필요한 것이 데이터인지 모델인지 알려준다</text>

  <g transform="translate(58 92)">
    <rect width="260" height="250" class="panel"/>
    <text x="130" y="32" text-anchor="middle" class="label">고편향</text>
    <text x="130" y="54" text-anchor="middle" class="small">둘 다 높은 오차로 수렴</text>
    <line x1="45" y1="196" x2="226" y2="196" class="axis"/>
    <line x1="45" y1="68" x2="45" y2="196" class="axis"/>
    <path d="M55 118 C100 124 146 130 216 134" class="train"/>
    <path d="M55 78 C100 102 150 124 216 136" class="val"/>
    <text x="82" y="218" class="small">데이터 크기</text>
  </g>

  <g transform="translate(360 92)">
    <rect width="260" height="250" class="panel"/>
    <text x="130" y="32" text-anchor="middle" class="label">고분산</text>
    <text x="130" y="54" text-anchor="middle" class="small">큰 간격, 데이터가 도움</text>
    <line x1="45" y1="196" x2="226" y2="196" class="axis"/>
    <line x1="45" y1="68" x2="45" y2="196" class="axis"/>
    <path d="M55 188 C110 178 160 164 216 148" class="train"/>
    <path d="M55 76 C110 96 158 114 216 128" class="val"/>
    <line x1="216" y1="128" x2="216" y2="148" class="gap"/>
    <text x="82" y="218" class="small">데이터 크기</text>
  </g>

  <g transform="translate(662 92)">
    <rect width="260" height="250" class="panel"/>
    <text x="130" y="32" text-anchor="middle" class="label">좋은 적합</text>
    <text x="130" y="54" text-anchor="middle" class="small">낮은 오차, 작은 간격</text>
    <line x1="45" y1="196" x2="226" y2="196" class="axis"/>
    <line x1="45" y1="68" x2="45" y2="196" class="axis"/>
    <path d="M55 166 C108 152 160 140 216 132" class="train"/>
    <path d="M55 110 C108 124 160 130 216 134" class="val"/>
    <text x="82" y="218" class="small">데이터 크기</text>
  </g>

  <rect x="324" y="362" width="332" height="42" fill="#ffffff" stroke="#d7ddea" stroke-width="1.5" rx="8"/>
  <line x1="354" y1="383" x2="404" y2="383" class="train"/>
  <text x="416" y="388" class="small">훈련 오차</text>
  <line x1="530" y1="383" x2="580" y2="383" class="val"/>
  <text x="592" y="388" class="small">검증 오차</text>
</svg>
