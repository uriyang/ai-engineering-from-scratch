<svg xmlns="http://www.w3.org/2000/svg" width="980" height="380" viewBox="0 0 980 380" role="img" aria-labelledby="title desc">
  <title id="title">Double Descent 곡선</title>
  <desc id="desc">고전적 U자형 이후 보간 임계점에서 테스트 오차가 크게 올라갔다가 과매개변수 영역에서 다시 내려가는 double descent 현상</desc>
  <defs>
    <style>
      .title { font: 700 26px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .label { font: 700 15px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .small { font: 14px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #526078; }
      .axis { stroke: #9aa7bd; stroke-width: 2; }
      .grid { stroke: #e3e7ef; stroke-width: 1; }
      .curve { stroke: #8b5cc7; stroke-width: 5; fill: none; }
      .train { stroke: #3b82c4; stroke-width: 3; fill: none; stroke-dasharray: 8 7; }
      .threshold { stroke: #d96b6b; stroke-width: 2.5; stroke-dasharray: 8 7; }
      .zone { fill: #ffffff; stroke: #d7ddea; stroke-width: 1.3; rx: 8; }
    </style>
  </defs>
  <rect width="980" height="380" fill="#f7f8fb"/>
  <text x="490" y="42" text-anchor="middle" class="title">현대 모델에서는 오차가 한 번 더 내려갈 수 있다</text>

  <g transform="translate(100 78)">
    <line x1="0" y1="240" x2="780" y2="240" class="axis"/>
    <line x1="0" y1="240" x2="0" y2="18" class="axis"/>
    <line x1="0" y1="180" x2="780" y2="180" class="grid"/>
    <line x1="0" y1="120" x2="780" y2="120" class="grid"/>
    <line x1="0" y1="60" x2="780" y2="60" class="grid"/>

    <path d="M30 80 C130 76 220 92 290 132 C350 168 405 86 430 30 C455 88 520 152 620 126 C690 108 735 92 758 82" class="curve"/>
    <path d="M30 128 C160 155 300 192 430 228 C560 232 670 234 758 236" class="train"/>
    <line x1="430" y1="20" x2="430" y2="240" class="threshold"/>

    <rect x="46" y="250" width="160" height="44" class="zone"/>
    <text x="126" y="278" text-anchor="middle" class="small">과소매개변수</text>
    <rect x="350" y="250" width="160" height="44" class="zone"/>
    <text x="430" y="278" text-anchor="middle" class="small">보간 임계점</text>
    <rect x="592" y="250" width="170" height="44" class="zone"/>
    <text x="677" y="278" text-anchor="middle" class="small">과매개변수</text>

    <text x="588" y="118" class="label" fill="#8b5cc7">검증/테스트 오차</text>
    <text x="538" y="230" class="label" fill="#3b82c4">훈련 오차</text>
    <text x="430" y="14" text-anchor="middle" class="label" fill="#d96b6b">p ≈ n</text>
    <text x="390" y="326" text-anchor="middle" class="label">모델 용량</text>
    <text x="-42" y="126" transform="rotate(-90 -42 126)" text-anchor="middle" class="label">오차</text>
  </g>
</svg>
