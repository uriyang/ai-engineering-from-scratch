<svg xmlns="http://www.w3.org/2000/svg" width="980" height="390" viewBox="0 0 980 390" role="img" aria-labelledby="title desc">
  <title id="title">비지도학습 방법 한눈에 보기</title>
  <desc id="desc">원시 데이터에서 K-Means, DBSCAN, 계층적 군집화, GMM으로 이어지는 선택 흐름과 각 방법의 특징</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#3f4b63"/>
    </marker>
    <style>
      .title { font: 700 26px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .label { font: 700 16px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .small { font: 14px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #526078; }
      .box { fill: #ffffff; stroke: #d7ddea; stroke-width: 1.5; rx: 8; }
      .blue { fill: #eef7ff; stroke: #3b82c4; }
      .orange { fill: #fff6e8; stroke: #d98b24; }
      .green { fill: #f1fbf4; stroke: #45a36d; }
      .purple { fill: #f5efff; stroke: #8b5cc7; }
      .red { fill: #fff1f1; stroke: #d96b6b; }
      .edge { stroke: #3f4b63; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="980" height="390" fill="#f7f8fb"/>
  <text x="490" y="42" text-anchor="middle" class="title">비지도학습은 라벨 없이 구조를 찾는다</text>

  <rect x="405" y="78" width="170" height="58" class="box blue"/>
  <text x="490" y="113" text-anchor="middle" class="label">원시 데이터</text>

  <rect x="405" y="174" width="170" height="58" class="box purple"/>
  <text x="490" y="208" text-anchor="middle" class="label">방법 선택</text>

  <rect x="68" y="286" width="190" height="70" class="box orange"/>
  <text x="163" y="312" text-anchor="middle" class="label">K-Means</text>
  <text x="163" y="336" text-anchor="middle" class="small">둥근 군집, 빠름</text>

  <rect x="292" y="286" width="190" height="70" class="box green"/>
  <text x="387" y="312" text-anchor="middle" class="label">DBSCAN</text>
  <text x="387" y="336" text-anchor="middle" class="small">임의 모양, 노이즈</text>

  <rect x="516" y="286" width="190" height="70" class="box red"/>
  <text x="611" y="312" text-anchor="middle" class="label">계층적 군집화</text>
  <text x="611" y="336" text-anchor="middle" class="small">중첩 구조, 덴드로그램</text>

  <rect x="740" y="286" width="190" height="70" class="box blue"/>
  <text x="835" y="312" text-anchor="middle" class="label">GMM</text>
  <text x="835" y="336" text-anchor="middle" class="small">확률적 소속, 타원형</text>

  <path d="M490 136 V162" class="edge"/>
  <path d="M448 232 C365 250 250 262 168 286" class="edge"/>
  <path d="M470 232 C440 252 410 266 390 286" class="edge"/>
  <path d="M510 232 C540 252 580 266 610 286" class="edge"/>
  <path d="M532 232 C630 250 740 262 828 286" class="edge"/>
</svg>
