<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">로지스틱 회귀 확률 흐름</title>
  <desc id="desc">선형 점수, 시그모이드, 임계값, 분류 지표로 이어지는 로지스틱 회귀 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#3f4b63"/>
    </marker>
    <style>
      .title { font: 700 26px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .label { font: 700 17px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .note { font: 14px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #526078; }
      .formula { font: 700 15px Menlo, Consolas, monospace; fill: #172033; }
      .box { fill: #ffffff; stroke: #d7ddea; stroke-width: 1.5; rx: 8; }
      .blue { fill: #eef7ff; stroke: #3b82c4; }
      .orange { fill: #fff6e8; stroke: #d98b24; }
      .green { fill: #f1fbf4; stroke: #45a36d; }
      .purple { fill: #f5efff; stroke: #8b5cc7; }
      .edge { stroke: #3f4b63; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .axis { stroke: #9aa7bd; stroke-width: 2; }
    </style>
  </defs>
  <rect width="980" height="360" fill="#f7f8fb"/>
  <text x="490" y="42" text-anchor="middle" class="title">로지스틱 회귀 확률 흐름</text>

  <g transform="translate(58 92)">
    <rect x="0" y="20" width="142" height="76" class="box blue"/>
    <text x="71" y="51" text-anchor="middle" class="label">입력 특징</text>
    <text x="71" y="76" text-anchor="middle" class="formula">x</text>

    <rect x="202" y="20" width="142" height="76" class="box orange"/>
    <text x="273" y="51" text-anchor="middle" class="label">선형 점수</text>
    <text x="273" y="76" text-anchor="middle" class="formula">z = wx + b</text>

    <rect x="404" y="20" width="142" height="76" class="box green"/>
    <text x="475" y="51" text-anchor="middle" class="label">시그모이드</text>
    <text x="475" y="76" text-anchor="middle" class="formula">p in [0,1]</text>

    <rect x="606" y="20" width="142" height="76" class="box purple"/>
    <text x="677" y="51" text-anchor="middle" class="label">임계값</text>
    <text x="677" y="76" text-anchor="middle" class="formula">p >= 0.5?</text>

    <rect x="808" y="20" width="92" height="76" class="box"/>
    <text x="854" y="51" text-anchor="middle" class="label">분류</text>
    <text x="854" y="76" text-anchor="middle" class="formula">0 or 1</text>

    <path d="M142 58 H190" class="edge"/>
    <path d="M344 58 H392" class="edge"/>
    <path d="M546 58 H594" class="edge"/>
    <path d="M748 58 H796" class="edge"/>
  </g>

  <g transform="translate(108 220)">
    <line x1="0" y1="80" x2="330" y2="80" class="axis"/>
    <line x1="165" y1="10" x2="165" y2="135" class="axis"/>
    <path d="M10 118 C82 118 96 102 135 82 C174 62 190 42 320 42" stroke="#3b82c4" stroke-width="4" fill="none"/>
    <line x1="0" y1="42" x2="330" y2="42" stroke="#d98b24" stroke-width="2" stroke-dasharray="6 5"/>
    <text x="338" y="47" class="note">p = 0.5</text>
    <text x="164" y="154" text-anchor="middle" class="note">결정 경계 z = 0</text>
  </g>

  <g transform="translate(550 220)">
    <rect x="0" y="0" width="118" height="46" class="box green"/>
    <text x="59" y="29" text-anchor="middle" class="label">정밀도</text>
    <rect x="142" y="0" width="118" height="46" class="box orange"/>
    <text x="201" y="29" text-anchor="middle" class="label">재현율</text>
    <rect x="284" y="0" width="118" height="46" class="box purple"/>
    <text x="343" y="29" text-anchor="middle" class="label">F1</text>
    <text x="201" y="82" text-anchor="middle" class="note">임계값을 바꾸면 지표의 균형도 바뀐다</text>
  </g>
</svg>
