<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="440" viewBox="0 0 1000 440" role="img" aria-labelledby="title desc"><title id="title">Z-score: 평균으로부터의 거리</title><desc id="desc">정규 기준 분포의 평균은 100, 표준편차는 10이다. 70부터 130까지는 3 표준편차 범위이며 140의 Z-score는 4다.</desc><rect width="1000" height="440" fill="#f7f9fc"/><text x="500" y="40" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#26344d" text-anchor="middle" font-weight="700">Z-score: 평균으로부터의 거리</text><text x="500" y="77" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="19" fill="#26344d" text-anchor="middle" font-weight="400">기준 분포: 평균 μ = 100, 표준편차 σ = 10</text><rect x="254.0" y="110" width="492.0" height="190" rx="8" fill="#e7f1ff" stroke="none"/><rect x="746.0" y="110" width="163.9999999999999" height="190" rx="8" fill="#fcebed" stroke="none"/><rect x="90.0" y="110" width="164.0" height="190" rx="8" fill="#fcebed" stroke="none"/><path d="M90.0,295.0 L98.2,295.0 L106.4,295.0 L114.6,295.0 L122.8,295.0 L131.0,295.0 L139.2,295.0 L147.4,295.0 L155.6,295.0 L163.8,295.0 L172.0,294.9 L180.2,294.9 L188.4,294.9 L196.6,294.8 L204.8,294.8 L213.0,294.7 L221.2,294.5 L229.4,294.3 L237.6,294.1 L245.8,293.7 L254.0,293.3 L262.2,292.7 L270.4,291.9 L278.6,291.0 L286.8,289.7 L295.0,288.2 L303.2,286.3 L311.4,284.0 L319.6,281.2 L327.8,277.9 L336.0,274.0 L344.2,269.5 L352.4,264.3 L360.6,258.5 L368.8,251.9 L377.0,244.7 L385.2,236.8 L393.4,228.4 L401.6,219.6 L409.8,210.4 L418.0,201.0 L426.2,191.6 L434.4,182.4 L442.6,173.7 L450.8,165.5 L459.0,158.2 L467.2,151.9 L475.4,146.8 L483.6,143.1 L491.8,140.8 L500.0,140.0 L508.2,140.8 L516.4,143.1 L524.6,146.8 L532.8,151.9 L541.0,158.2 L549.2,165.5 L557.4,173.7 L565.6,182.4 L573.8,191.6 L582.0,201.0 L590.2,210.4 L598.4,219.6 L606.6,228.4 L614.8,236.8 L623.0,244.7 L631.2,251.9 L639.4,258.5 L647.6,264.3 L655.8,269.5 L664.0,274.0 L672.2,277.9 L680.4,281.2 L688.6,284.0 L696.8,286.3 L705.0,288.2 L713.2,289.7 L721.4,291.0 L729.6,291.9 L737.8,292.7 L746.0,293.3 L754.2,293.7 L762.4,294.1 L770.6,294.3 L778.8,294.5 L787.0,294.7 L795.2,294.8 L803.4,294.8 L811.6,294.9 L819.8,294.9 L828.0,294.9 L836.2,295.0 L844.4,295.0 L852.6,295.0 L860.8,295.0 L869.0,295.0 L877.2,295.0 L885.4,295.0 L893.6,295.0 L901.8,295.0 L910.0,295.0" fill="none" stroke="#357cb9" stroke-width="3"/><path d="M90.0,300 L909.9999999999999,300" fill="none" stroke="#94a3b8" stroke-width="2"/><path d="M254.0,115 L254.0,305" fill="none" stroke="#357cb9" stroke-width="2" stroke-dasharray="6 5"/><text x="254.0" y="329" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" fill="#26344d" text-anchor="middle" font-weight="400">70 = μ − 3σ</text><path d="M499.99999999999994,115 L499.99999999999994,305" fill="none" stroke="#357cb9" stroke-width="2" stroke-dasharray="6 5"/><text x="499.99999999999994" y="329" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" fill="#26344d" text-anchor="middle" font-weight="400">100 = μ</text><path d="M746.0,115 L746.0,305" fill="none" stroke="#357cb9" stroke-width="2" stroke-dasharray="6 5"/><text x="746.0" y="329" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" fill="#26344d" text-anchor="middle" font-weight="400">130 = μ + 3σ</text><path d="M827.9999999999999,240 L827.9999999999999,300" fill="none" stroke="#c34359" stroke-width="2"/><circle cx="827.9999999999999" cy="280" r="8" fill="#c34359"/><text x="827.9999999999999" y="221" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" fill="#c34359" text-anchor="middle" font-weight="400">x = 140</text><text x="827.9999999999999" y="246" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" fill="#c34359" text-anchor="middle" font-weight="400">z = 4</text><text x="500" y="369" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="19" fill="#26344d" text-anchor="middle" font-weight="700">|z| &gt; 3일 때 후보: 평균에서 얼마나 먼지를 표준편차 단위로 측정</text><text x="500" y="406" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" fill="#26344d" text-anchor="middle" font-weight="400">파란 영역은 ±3σ 범위다. 약 99.7%라는 비율은 정규분포일 때의 해석이다.</text></svg>