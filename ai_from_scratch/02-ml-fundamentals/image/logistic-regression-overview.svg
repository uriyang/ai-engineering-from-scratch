<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">로지스틱 회귀 한눈에 보기</title>
  <desc id="desc">로지스틱 회귀의 입력, 선형 점수, 시그모이드, 손실, 학습, 평가, 임계값 조정을 요약한 그림</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#3f4b63"/>
    </marker>
    <style>
      .title { font: 700 26px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .label { font: 700 17px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .note { font: 14px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #526078; }
      .formula { font: 700 14px Menlo, Consolas, monospace; fill: #172033; }
      .box { fill: #ffffff; stroke: #d7ddea; stroke-width: 1.5; rx: 8; }
      .blue { fill: #eef7ff; stroke: #3b82c4; }
      .orange { fill: #fff6e8; stroke: #d98b24; }
      .green { fill: #f1fbf4; stroke: #45a36d; }
      .purple { fill: #f5efff; stroke: #8b5cc7; }
      .edge { stroke: #3f4b63; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .axis { stroke: #9aa7bd; stroke-width: 2; }
    </style>
  </defs>
  <rect width="980" height="420" fill="#f7f8fb"/>
  <text x="490" y="42" text-anchor="middle" class="title">로지스틱 회귀 한눈에 보기</text>

  <g transform="translate(52 82)">
    <rect x="0" y="0" width="130" height="66" class="box blue"/>
    <text x="65" y="28" text-anchor="middle" class="label">입력</text>
    <text x="65" y="50" text-anchor="middle" class="formula">x</text>

    <rect x="178" y="0" width="130" height="66" class="box orange"/>
    <text x="243" y="28" text-anchor="middle" class="label">선형 점수</text>
    <text x="243" y="50" text-anchor="middle" class="formula">z = wx + b</text>

    <rect x="356" y="0" width="130" height="66" class="box green"/>
    <text x="421" y="28" text-anchor="middle" class="label">시그모이드</text>
    <text x="421" y="50" text-anchor="middle" class="formula">p = sigmoid(z)</text>

    <rect x="534" y="0" width="130" height="66" class="box purple"/>
    <text x="599" y="28" text-anchor="middle" class="label">확률 판단</text>
    <text x="599" y="50" text-anchor="middle" class="formula">p >= threshold</text>

    <rect x="712" y="0" width="130" height="66" class="box"/>
    <text x="777" y="28" text-anchor="middle" class="label">분류 결과</text>
    <text x="777" y="50" text-anchor="middle" class="formula">0 or 1</text>

    <path d="M130 33 H166" class="edge"/>
    <path d="M308 33 H344" class="edge"/>
    <path d="M486 33 H522" class="edge"/>
    <path d="M664 33 H700" class="edge"/>
  </g>

  <g transform="translate(75 190)">
    <rect x="0" y="0" width="240" height="135" class="box"/>
    <text x="120" y="30" text-anchor="middle" class="label">왜 시그모이드인가</text>
    <line x1="42" y1="104" x2="198" y2="104" class="axis"/>
    <line x1="120" y1="46" x2="120" y2="118" class="axis"/>
    <path d="M48 98 C86 98 94 82 114 68 C134 54 148 50 192 50" stroke="#3b82c4" stroke-width="4" fill="none"/>
    <text x="120" y="128" text-anchor="middle" class="note">점수를 0~1 확률로 압축</text>
  </g>

  <g transform="translate(370 190)">
    <rect x="0" y="0" width="240" height="135" class="box"/>
    <text x="120" y="30" text-anchor="middle" class="label">어떻게 학습하나</text>
    <rect x="42" y="52" width="70" height="38" class="orange"/>
    <text x="77" y="76" text-anchor="middle" class="formula">BCE</text>
    <path d="M116 71 H138" class="edge"/>
    <rect x="150" y="52" width="55" height="38" class="green"/>
    <text x="177" y="76" text-anchor="middle" class="formula">grad</text>
    <text x="120" y="118" text-anchor="middle" class="note">교차 엔트로피 손실을 줄임</text>
  </g>

  <g transform="translate(665 190)">
    <rect x="0" y="0" width="240" height="135" class="box"/>
    <text x="120" y="30" text-anchor="middle" class="label">어떻게 평가하나</text>
    <rect x="48" y="52" width="54" height="34" class="blue"/>
    <text x="75" y="74" text-anchor="middle" class="formula">TP</text>
    <rect x="108" y="52" width="54" height="34" class="orange"/>
    <text x="135" y="74" text-anchor="middle" class="formula">FP</text>
    <rect x="48" y="90" width="54" height="34" class="green"/>
    <text x="75" y="112" text-anchor="middle" class="formula">FN</text>
    <rect x="108" y="90" width="54" height="34" class="purple"/>
    <text x="135" y="112" text-anchor="middle" class="formula">TN</text>
    <text x="120" y="118" text-anchor="middle" class="note"></text>
  </g>

  <text x="490" y="375" text-anchor="middle" class="note">핵심은 선형 점수를 확률로 바꾸고, 임계값과 지표로 업무 목적에 맞게 판단하는 것이다.</text>
</svg>
