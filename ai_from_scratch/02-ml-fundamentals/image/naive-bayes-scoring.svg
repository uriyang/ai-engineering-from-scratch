<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">나이브 베이즈: 빈도에서 로그 점수로</title><desc id="desc">두 클래스의 로그 점수는 스팸 약 -3.108, 정상 약 -8.841이다. 더 큰 스팸 점수를 선택한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#63758e"/></marker></defs><rect width="1100" height="520" fill="#f7f9fc"/><text x="550" y="43" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="700" fill="#24334b">나이브 베이즈: 빈도에서 로그 점수로</text><text x="550" y="83" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="400" fill="#24334b">예시 입력: free free money → x = [2, 1, 0]</text><rect x="40" y="125" width="300" height="105" rx="12" fill="#e8f1ff" stroke="#c6d2e1"/><text x="190.0" y="156.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">훈련에서 저장한 정보</text><text x="190.0" y="183.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">클래스 사전확률 P(c)</text><text x="190.0" y="210.5" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">스무딩한 단어 확률 theta</text><rect x="400" y="125" width="300" height="105" rx="12" fill="#e8f6ef" stroke="#c6d2e1"/><text x="550.0" y="170.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">로그 점수 계산</text><text x="550.0" y="197.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">log P(c) + Σ x_j log theta_cj</text><rect x="760" y="125" width="300" height="105" rx="12" fill="#fff2df" stroke="#c6d2e1"/><text x="910.0" y="170.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">점수 비교</text><text x="910.0" y="197.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">가장 큰 클래스 선택</text><path d="M340,178 L400,178" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M700,178 L760,178" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="80" y="287" text-anchor="start" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" fill="#24334b">스팸</text><text x="80" y="355" text-anchor="start" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" fill="#24334b">정상</text><text x="550" y="270" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="600" fill="#24334b">점수 차이 = 약 5.734 → 스팸 선택</text><path d="M270,300 L920,300" stroke="#d4dce8" stroke-width="2" fill="none"/><circle cx="717.98" cy="300" r="9" fill="#42865d"/><text x="717.98" y="286" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="400" fill="#42865d">-3.108</text><path d="M270,368 L920,368" stroke="#d4dce8" stroke-width="2" fill="none"/><circle cx="345.33500000000004" cy="368" r="9" fill="#6785b5"/><text x="345.33500000000004" y="354" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="400" fill="#6785b5">-8.841</text><text x="270" y="417" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="400" fill="#24334b">-10</text><text x="400" y="417" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="400" fill="#24334b">-8</text><text x="530" y="417" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="400" fill="#24334b">-6</text><text x="660" y="417" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="400" fill="#24334b">-4</text><text x="790" y="417" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="400" fill="#24334b">-2</text><text x="920" y="417" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="15" font-weight="400" fill="#24334b">0</text><text x="550" y="465" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="400" fill="#24334b">큰 로그 점수가 유리하다. 정규화 전 점수 자체는 사후확률이 아니다.</text></svg>