<svg xmlns="http://www.w3.org/2000/svg" width="980" height="360" viewBox="0 0 980 360" role="img" aria-labelledby="title desc">
  <title id="title">SVM 커널 트릭</title>
  <desc id="desc">입력 공간에서 직선으로 분리하기 어려운 데이터를 커널 함수로 특징 공간의 선형 분리 문제처럼 다루는 과정</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#3f4b63"/>
    </marker>
    <style>
      .title { font: 700 26px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .label { font: 700 17px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .note { font: 14px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #526078; }
      .formula { font: 700 15px Menlo, Consolas, monospace; fill: #172033; }
      .panel { fill: #ffffff; stroke: #d7ddea; stroke-width: 1.5; rx: 8; }
      .edge { stroke: #3f4b63; stroke-width: 2.3; fill: none; marker-end: url(#arrow); }
      .axis { stroke: #c8d0df; stroke-width: 1.5; }
      .circle-boundary { fill: none; stroke: #8b5cc7; stroke-width: 3; stroke-dasharray: 8 7; }
      .line-boundary { stroke: #8b5cc7; stroke-width: 4; }
    </style>
  </defs>
  <rect width="980" height="360" fill="#f7f8fb"/>
  <text x="490" y="42" text-anchor="middle" class="title">커널 트릭: 직접 올리지 않고 고차원을 쓴다</text>

  <rect x="54" y="82" width="350" height="230" class="panel"/>
  <text x="229" y="114" text-anchor="middle" class="label">입력 공간</text>
  <text x="229" y="137" text-anchor="middle" class="note">직선 하나로는 분리하기 어려움</text>
  <line x1="105" y1="270" x2="350" y2="270" class="axis"/>
  <line x1="105" y1="155" x2="105" y2="270" class="axis"/>
  <circle cx="225" cy="215" r="55" class="circle-boundary"/>
  <circle cx="205" cy="205" r="7" fill="#3b82c4"/>
  <circle cx="235" cy="225" r="7" fill="#3b82c4"/>
  <circle cx="222" cy="190" r="7" fill="#3b82c4"/>
  <circle cx="145" cy="170" r="7" fill="#d96b6b"/>
  <circle cx="310" cy="245" r="7" fill="#d96b6b"/>
  <circle cx="290" cy="165" r="7" fill="#d96b6b"/>
  <circle cx="165" cy="260" r="7" fill="#d96b6b"/>

  <path d="M420 198 H560" class="edge"/>
  <text x="490" y="175" text-anchor="middle" class="formula">K(x,z) = phi(x) . phi(z)</text>
  <text x="490" y="225" text-anchor="middle" class="note">좌표 변환을 명시적으로 만들지 않음</text>

  <rect x="576" y="82" width="350" height="230" class="panel"/>
  <text x="751" y="114" text-anchor="middle" class="label">특징 공간</text>
  <text x="751" y="137" text-anchor="middle" class="note">커널 값만으로 선형 분리처럼 계산</text>
  <line x1="625" y1="270" x2="870" y2="270" class="axis"/>
  <line x1="625" y1="155" x2="625" y2="270" class="axis"/>
  <line x1="690" y1="282" x2="825" y2="150" class="line-boundary"/>
  <circle cx="680" cy="230" r="7" fill="#3b82c4"/>
  <circle cx="715" cy="238" r="7" fill="#3b82c4"/>
  <circle cx="705" cy="205" r="7" fill="#3b82c4"/>
  <circle cx="790" cy="220" r="7" fill="#d96b6b"/>
  <circle cx="835" cy="250" r="7" fill="#d96b6b"/>
  <circle cx="815" cy="178" r="7" fill="#d96b6b"/>
  <circle cx="760" cy="265" r="7" fill="#d96b6b"/>
</svg>
