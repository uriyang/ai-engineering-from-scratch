<svg xmlns="http://www.w3.org/2000/svg" width="980" height="430" viewBox="0 0 980 430" role="img" aria-labelledby="title desc">
  <title id="title">훈련 오차와 검증 오차로 진단하기</title>
  <desc id="desc">훈련 오차와 검증 오차의 크기와 간격으로 고편향, 고분산, 좋은 적합을 구분하는 흐름</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#3f4b63"/>
    </marker>
    <style>
      .title { font: 700 26px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .label { font: 700 16px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .small { font: 14px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #526078; }
      .box { fill: #ffffff; stroke: #d7ddea; stroke-width: 1.5; rx: 8; }
      .blue { fill: #eef7ff; stroke: #3b82c4; }
      .orange { fill: #fff6e8; stroke: #d98b24; }
      .red { fill: #fff1f1; stroke: #d96b6b; }
      .green { fill: #f1fbf4; stroke: #45a36d; }
      .purple { fill: #f5efff; stroke: #8b5cc7; }
      .edge { stroke: #3f4b63; stroke-width: 2.1; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="980" height="430" fill="#f7f8fb"/>
  <text x="490" y="42" text-anchor="middle" class="title">오차 패턴을 보면 다음 조치가 보인다</text>

  <rect x="370" y="82" width="240" height="64" class="box blue"/>
  <text x="490" y="109" text-anchor="middle" class="label">훈련 오차와 검증 오차 비교</text>
  <text x="490" y="132" text-anchor="middle" class="small">train vs validation</text>

  <rect x="78" y="210" width="230" height="78" class="box orange"/>
  <text x="193" y="238" text-anchor="middle" class="label">둘 다 높음</text>
  <text x="193" y="262" text-anchor="middle" class="small">간격은 작음</text>
  <text x="193" y="282" text-anchor="middle" class="small">고편향 / 과소적합</text>

  <rect x="375" y="210" width="230" height="78" class="box red"/>
  <text x="490" y="238" text-anchor="middle" class="label">훈련 낮고 검증 높음</text>
  <text x="490" y="262" text-anchor="middle" class="small">간격이 큼</text>
  <text x="490" y="282" text-anchor="middle" class="small">고분산 / 과적합</text>

  <rect x="672" y="210" width="230" height="78" class="box green"/>
  <text x="787" y="238" text-anchor="middle" class="label">둘 다 낮음</text>
  <text x="787" y="262" text-anchor="middle" class="small">간격도 작음</text>
  <text x="787" y="282" text-anchor="middle" class="small">좋은 적합</text>

  <rect x="78" y="338" width="230" height="58" class="box purple"/>
  <text x="193" y="362" text-anchor="middle" class="small">특징 추가, 복잡한 모델</text>
  <text x="193" y="383" text-anchor="middle" class="small">정규화 완화</text>

  <rect x="375" y="338" width="230" height="58" class="box purple"/>
  <text x="490" y="362" text-anchor="middle" class="small">데이터 추가, 정규화 강화</text>
  <text x="490" y="383" text-anchor="middle" class="small">단순한 모델, 조기 종료</text>

  <rect x="672" y="338" width="230" height="58" class="box purple"/>
  <text x="787" y="372" text-anchor="middle" class="small">테스트 후 배포 고려</text>

  <path d="M428 146 C338 172 260 188 204 210" class="edge"/>
  <path d="M490 146 V198" class="edge"/>
  <path d="M552 146 C642 172 720 188 776 210" class="edge"/>
  <path d="M193 288 V326" class="edge"/>
  <path d="M490 288 V326" class="edge"/>
  <path d="M787 288 V326" class="edge"/>
</svg>
