<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="455" viewBox="0 0 1000 455" role="img" aria-labelledby="title desc"><title id="title">Isolation Forest: 밀도가 아니라 고립 경로를 측정</title><desc id="desc">첫 수직 분할이 오른쪽 이상 후보를 고립시킨다. 왼쪽 밀집 집단에는 수평과 수직 분할이 추가로 필요하며 최종 점수는 여러 트리에서 평균한다.</desc><rect width="1000" height="455" fill="#f7f9fc"/><text x="500" y="40" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="26" fill="#26344d" text-anchor="middle" font-weight="700">Isolation Forest: 밀도가 아니라 고립 경로를 측정</text><text x="500" y="78" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="19" fill="#26344d" text-anchor="middle" font-weight="400">한 트리의 분할 예시: 오른쪽 점은 첫 분할에서 고립된다.</text><rect x="45" y="105" width="580" height="245" rx="8" fill="#fff" stroke="#d3dce8"/><circle cx="304.44016339475746" cy="243.95965532279996" r="4" fill="#357cb9"/><circle cx="269.6217816652364" cy="261.6568689029113" r="4" fill="#357cb9"/><circle cx="203.93000758530764" cy="176.26158158185467" r="4" fill="#357cb9"/><circle cx="191.66621592494002" cy="242.9167635962057" r="4" fill="#357cb9"/><circle cx="285.43182223795026" cy="235.4727444773437" r="4" fill="#357cb9"/><circle cx="181.5229727597083" cy="280.19434343380624" r="4" fill="#357cb9"/><circle cx="170.96852264446554" cy="213.91343715159843" r="4" fill="#357cb9"/><circle cx="215.49287745966058" cy="239.77114215845293" r="4" fill="#357cb9"/><circle cx="287.1771652720103" cy="178.7535566063527" r="4" fill="#357cb9"/><circle cx="226.28527507369554" cy="242.04339231493267" r="4" fill="#357cb9"/><circle cx="189.81831612211704" cy="227.80337102786993" r="4" fill="#357cb9"/><circle cx="248.099023171065" cy="184.26171293925842" r="4" fill="#357cb9"/><circle cx="183.78550331586897" cy="229.07956431897009" r="4" fill="#357cb9"/><circle cx="230.25405858955" cy="238.7431139055417" r="4" fill="#357cb9"/><circle cx="335.08900952354116" cy="262.32717277504463" r="4" fill="#357cb9"/><circle cx="259.137515246586" cy="206.14431279143398" r="4" fill="#357cb9"/><circle cx="280.00834388656386" cy="203.62710994157675" r="4" fill="#357cb9"/><circle cx="307.48670460775577" cy="272.53596424939406" r="4" fill="#357cb9"/><circle cx="153.7953892742859" cy="189.8734553670854" r="4" fill="#357cb9"/><circle cx="231.77919448738103" cy="216.95198001377042" r="4" fill="#357cb9"/><circle cx="185.78454824013588" cy="188.10280576624874" r="4" fill="#357cb9"/><circle cx="271.05206530788" cy="212.3716796818533" r="4" fill="#357cb9"/><circle cx="174.2658359315305" cy="221.1791977424781" r="4" fill="#357cb9"/><circle cx="281.6902861995311" cy="289.9048791968617" r="4" fill="#357cb9"/><circle cx="242.6568745277395" cy="219.98897534236093" r="4" fill="#357cb9"/><circle cx="205.4129330794676" cy="212.78260365540828" r="4" fill="#357cb9"/><circle cx="262.9188906269206" cy="274.8691653115943" r="4" fill="#357cb9"/><circle cx="293.47064983190324" cy="222.46340986644532" r="4" fill="#357cb9"/><circle cx="278.05206908142816" cy="257.72415964704015" r="4" fill="#357cb9"/><circle cx="259.50858576766166" cy="145.22108153743625" r="4" fill="#357cb9"/><circle cx="237.28784656392912" cy="221.07173629360045" r="4" fill="#357cb9"/><circle cx="297.07449792737424" cy="221.09138547955064" r="4" fill="#357cb9"/><circle cx="259.39926788060285" cy="240.15810580713287" r="4" fill="#357cb9"/><circle cx="294.4722500582127" cy="257.685146662631" r="4" fill="#357cb9"/><circle cx="284.23547217051447" cy="283.3446986725183" r="4" fill="#357cb9"/><circle cx="281.2370953485571" cy="258.39323376470804" r="4" fill="#357cb9"/><circle cx="228.7920650441839" cy="234.40947365202464" r="4" fill="#357cb9"/><circle cx="332.98226318300027" cy="232.19818667220977" r="4" fill="#357cb9"/><circle cx="261.91794772943604" cy="228.35883071438138" r="4" fill="#357cb9"/><circle cx="227.49296006528226" cy="126.18297737655142" r="4" fill="#357cb9"/><circle cx="313.5980638212386" cy="189.63466996378256" r="4" fill="#357cb9"/><circle cx="204.23582174851282" cy="278.40947296539423" r="4" fill="#357cb9"/><circle cx="547" cy="156" r="8" fill="#c34359"/><path d="M450,105 L450,350" fill="none" stroke="#c34359" stroke-width="3"/><text x="472" y="332" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="22" fill="#c34359" text-anchor="middle" font-weight="400">①</text><path d="M45,222 L450,222" fill="none" stroke="#357cb9" stroke-width="2" stroke-dasharray="6 5"/><text x="74" y="210" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="20" fill="#357cb9" text-anchor="middle" font-weight="400">②</text><path d="M225,105 L225,222" fill="none" stroke="#357cb9" stroke-width="2" stroke-dasharray="6 5"/><text x="243" y="125" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="20" fill="#357cb9" text-anchor="middle" font-weight="400">③</text><path d="M225,173 L450,173" fill="none" stroke="#357cb9" stroke-width="2" stroke-dasharray="6 5"/><text x="422" y="164" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="20" fill="#357cb9" text-anchor="middle" font-weight="400">④</text><text x="547" y="131" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" fill="#c34359" text-anchor="middle" font-weight="400">이상 후보</text><text x="328" y="331" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" fill="#357cb9" text-anchor="middle" font-weight="400">정상 집단: 더 많은 분할 필요</text><rect x="665" y="115" width="295" height="95" rx="8" fill="#fcebed" stroke="none"/><text x="812" y="150" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="21" fill="#c34359" text-anchor="middle" font-weight="700">이상 후보</text><text x="812" y="184" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" fill="#26344d" text-anchor="middle" font-weight="400">경로가 짧음 → 높은 점수</text><rect x="665" y="230" width="295" height="95" rx="8" fill="#e7f1ff" stroke="none"/><text x="812" y="265" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="21" fill="#357cb9" text-anchor="middle" font-weight="700">밀집된 정상 집단</text><text x="812" y="299" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" fill="#26344d" text-anchor="middle" font-weight="400">경로가 길어지는 경향</text><text x="500" y="390" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="20" fill="#26344d" text-anchor="middle" font-weight="700">실제 모델은 여러 무작위 트리의 경로 길이를 평균낸다.</text><text x="500" y="424" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" fill="#26344d" text-anchor="middle" font-weight="400">선은 분할 순서를 설명하는 예시다. 하나의 트리나 한 번의 분할로 최종 판정하지 않는다.</text></svg>