<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="640" viewBox="0 0 1100 640" role="img" aria-labelledby="title desc"><title id="title">시계열 검증: 확장 창과 이동 창</title><desc id="desc">확장 창은 훈련 시작점을 유지하고, 이동 창은 최근 3개월을 사용한다. 검증은 언제나 훈련 이후다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#63758e"/></marker></defs><rect width="1100" height="640" fill="#f7f9fc"/><text x="550" y="43" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="700" fill="#24334b">시계열 검증: 확장 창과 이동 창</text><text x="550" y="80" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="400" fill="#24334b">각 검증 구간보다 앞선 데이터로만 학습한다.</text><text x="265" y="120" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">1월</text><text x="365" y="120" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">2월</text><text x="465" y="120" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">3월</text><text x="565" y="120" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">4월</text><text x="665" y="120" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">5월</text><text x="765" y="120" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">6월</text><text x="865" y="120" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">7월</text><text x="965" y="120" text-anchor="middl