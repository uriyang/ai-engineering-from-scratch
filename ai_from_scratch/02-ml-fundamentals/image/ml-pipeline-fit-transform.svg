<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">ML 파이프라인: fit과 transform</title><desc id="desc">학습 경로와 추론 경로를 나란히 비교한다. 저장한 전처리 통계와 모델을 추론에 재사용한다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#63758e"/></marker></defs><rect width="1100" height="520" fill="#f7f9fc"/><text x="550" y="43" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="700" fill="#24334b">ML 파이프라인: fit과 transform</text><text x="550" y="81" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="400" fill="#24334b">전처리 상태는 훈련에서만 학습하고, 추론에서는 그대로 적용한다.</text><text x="65" y="145" text-anchor="start" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" fill="#24334b">학습</text><rect x="40" y="170" width="180" height="85" rx="12" fill="#e8f1ff" stroke="#c6d2e1"/><text x="130.0" y="205.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">훈련 데이터</text><text x="130.0" y="232.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">결측치·수치·범주</text><rect x="280" y="170" width="230" height="85" rx="12" fill="#e8f1ff" stroke="#c6d2e1"/><text x="395.0" y="205.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">전처리 fit + transform</text><text x="395.0" y="232.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">중앙값·평균·범주 학습</text><rect x="570" y="170" width="190" height="85" rx="12" fill="#e8f6ef" stroke="#c6d2e1"/><text x="665.0" y="205.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">모델 fit</text><text x="665.0" y="232.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">변환된 특징 사용</text><rect x="820" y="170" width="240" height="85" rx="12" fill="#fff2df" stroke="#c6d2e1"/><text x="940.0" y="205.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">전체 상태 저장</text><text x="940.0" y="232.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">전처리 + 모델 + 스키마</text><path d="M220,213 L280,213" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M510,213 L570,213" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M760,213 L820,213" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="65" y="332" text-anchor="start" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="20" font-weight="700" fill="#24334b">추론</text><rect x="40" y="357" width="180" height="85" rx="12" fill="#e8f1ff" stroke="#c6d2e1"/><text x="130.0" y="392.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">새 입력</text><text x="130.0" y="419.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">학습에 사용하지 않음</text><rect x="280" y="357" width="230" height="85" rx="12" fill="#e8f1ff" stroke="#c6d2e1"/><text x="395.0" y="392.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">전처리 transform</text><text x="395.0" y="419.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">저장된 통계·범주 적용</text><rect x="570" y="357" width="190" height="85" rx="12" fill="#e8f6ef" stroke="#c6d2e1"/><text x="665.0" y="392.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">모델 predict</text><text x="665.0" y="419.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">저장된 모델 사용</text><rect x="820" y="357" width="240" height="85" rx="12" fill="#fff2df" stroke="#c6d2e1"/><text x="940.0" y="392.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">예측 결과</text><text x="940.0" y="419.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">동일 입력·상태로 재현</text><path d="M220,400 L280,400" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M510,400 L570,400" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M760,400 L820,400" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M395,255 L395,357" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="410" y="310" text-anchor="start" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">학습 상태 재사용</text><path d="M665,255 L665,357" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)" stroke-dasharray="5 5"/><text x="550" y="490" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="400" fill="#24334b">교차검증: 각 훈련 fold에서 전처리와 모델을 모두 새로 fit한다.</text></svg>