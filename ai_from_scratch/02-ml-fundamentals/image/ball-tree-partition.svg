<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">Ball tree 공간 분할</title>
  <desc id="desc">Ball tree가 데이터 묶음을 중심과 반지름을 가진 공 모양 영역으로 감싸고, 쿼리점에서 너무 먼 공은 통째로 건너뛰는 모습을 보여준다</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,1 L9,5 L1,9 Z" fill="#3f4b63"/>
    </marker>
    <style>
      .title { font: 700 26px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .label { font: 700 16px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .small { font: 14px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #526078; }
      .formula { font: 700 13px Menlo, Consolas, monospace; fill: #172033; }
      .panel { fill: #ffffff; stroke: #d7ddea; stroke-width: 1.5; rx: 8; }
      .ballA { fill: #eef7ff; stroke: #3b82c4; stroke-width: 2.5; fill-opacity: 0.68; }
      .ballB { fill: #fff6e8; stroke: #d98b24; stroke-width: 2.5; fill-opacity: 0.7; }
      .ballC { fill: #f1fbf4; stroke: #45a36d; stroke-width: 2.5; fill-opacity: 0.72; }
      .query { fill: #172033; }
      .center { fill: #ffffff; stroke: #172033; stroke-width: 2.2; }
      .edge { stroke: #3f4b63; stroke-width: 2; fill: none; marker-end: url(#arrow); }
      .radius { stroke: #8b5cc7; stroke-width: 2; stroke-dasharray: 7 7; fill: none; }
      .skip { stroke: #d96b6b; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; }
      .box { fill: #ffffff; stroke: #d7ddea; stroke-width: 1.5; rx: 8; }
    </style>
  </defs>

  <rect width="980" height="420" fill="#f7f8fb"/>
  <text x="490" y="42" text-anchor="middle" class="title">Ball tree는 데이터 묶음을 공 모양 영역으로 감싼다</text>

  <rect x="60" y="82" width="460" height="292" class="panel"/>
  <text x="290" y="112" text-anchor="middle" class="label">공으로 감싼 공간 분할</text>
  <text x="290" y="136" text-anchor="middle" class="small">각 노드는 center와 radius를 가진다</text>

  <circle cx="230" cy="246" r="86" class="ballA"/>
  <circle cx="355" cy="216" r="78" class="ballB"/>
  <circle cx="330" cy="304" r="54" class="ballC"/>

  <circle cx="230" cy="246" r="6" class="center"/>
  <circle cx="355" cy="216" r="6" class="center"/>
  <circle cx="330" cy="304" r="6" class="center"/>
  <path d="M230 246 H316" class="radius"/>
  <path d="M355 216 H433" class="radius"/>
  <path d="M330 304 H384" class="radius"/>

  <circle cx="162" cy="212" r="7" fill="#3b82c4"/>
  <circle cx="202" cy="260" r="7" fill="#3b82c4"/>
  <circle cx="252" cy="210" r="7" fill="#3b82c4"/>
  <circle cx="326" cy="190" r="7" fill="#d98b24"/>
  <circle cx="382" cy="224" r="7" fill="#d98b24"/>
  <circle cx="398" cy="170" r="7" fill="#d98b24"/>
  <circle cx="302" cy="318" r="7" fill="#45a36d"/>
  <circle cx="350" cy="336" r="7" fill="#45a36d"/>
  <circle cx="360" cy="284" r="7" fill="#45a36d"/>

  <circle cx="110" cy="322" r="9" class="query"/>
  <text x="110" y="350" text-anchor="middle" class="small">query</text>
  <path d="M110 322 C152 352 204 354 270 334" class="edge"/>
  <path d="M110 322 C188 258 290 196 430 170" class="skip"/>
  <text x="250" y="365" text-anchor="middle" class="small">가까운 공만 더 자세히 탐색</text>
  <text x="370" y="162" text-anchor="middle" class="small">먼 공은 건너뜀</text>

  <rect x="590" y="92" width="300" height="58" class="box"/>
  <text x="740" y="117" text-anchor="middle" class="label">전체 데이터 공</text>
  <text x="740" y="138" text-anchor="middle" class="formula">center, radius</text>

  <rect x="550" y="205" width="220" height="58" class="box"/>
  <text x="660" y="230" text-anchor="middle" class="label">왼쪽 하위 공</text>
  <text x="660" y="251" text-anchor="middle" class="small">가까우면 탐색</text>

  <rect x="800" y="205" width="130" height="58" class="box"/>
  <text x="865" y="230" text-anchor="middle" class="label">오른쪽 공</text>
  <text x="865" y="251" text-anchor="middle" class="small">멀면 pruning</text>

  <rect x="562" y="318" width="120" height="44" class="box"/>
  <text x="622" y="346" text-anchor="middle" class="small">리프</text>
  <rect x="700" y="318" width="120" height="44" class="box"/>
  <text x="760" y="346" text-anchor="middle" class="small">리프</text>

  <path d="M700 150 C676 174 664 188 660 205" class="edge"/>
  <path d="M780 150 C828 174 852 188 862 205" class="edge"/>
  <path d="M640 263 C628 288 624 302 622 318" class="edge"/>
  <path d="M692 263 C724 288 750 302 758 318" class="edge"/>
</svg>
