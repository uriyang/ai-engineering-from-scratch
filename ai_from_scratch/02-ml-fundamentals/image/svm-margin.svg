<svg xmlns="http://www.w3.org/2000/svg" width="980" height="420" viewBox="0 0 980 420" role="img" aria-labelledby="title desc">
  <title id="title">SVM 최대 마진</title>
  <desc id="desc">두 클래스 사이의 결정 경계와 양쪽 마진 경계, 그리고 마진에 닿은 서포트 벡터</desc>
  <defs>
    <style>
      .title { font: 700 26px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .label { font: 700 16px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #172033; }
      .note { font: 14px Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif; fill: #526078; }
      .formula { font: 700 15px Menlo, Consolas, monospace; fill: #172033; }
      .axis { stroke: #c8d0df; stroke-width: 1.5; }
      .boundary { stroke: #172033; stroke-width: 4; }
      .margin { stroke: #8b5cc7; stroke-width: 2.5; stroke-dasharray: 10 8; }
      .guide { stroke: #d98b24; stroke-width: 2; stroke-dasharray: 5 6; }
    </style>
  </defs>
  <rect width="980" height="420" fill="#f7f8fb"/>
  <text x="490" y="42" text-anchor="middle" class="title">SVM은 가장 넓은 마진을 찾는다</text>
  <text x="490" y="70" text-anchor="middle" class="note">결정 경계는 가장 가까운 훈련 샘플, 즉 서포트 벡터에 의해 정해진다</text>

  <line x1="105" y1="350" x2="880" y2="350" class="axis"/>
  <line x1="105" y1="95" x2="105" y2="350" class="axis"/>

  <line x1="260" y1="350" x2="645" y2="95" class="margin"/>
  <line x1="360" y1="350" x2="745" y2="95" class="boundary"/>
  <line x1="460" y1="350" x2="845" y2="95" class="margin"/>

  <text x="615" y="115" class="formula">w^T x + b = +1</text>
  <text x="720" y="145" class="formula">w^T x + b = 0</text>
  <text x="770" y="230" class="formula">w^T x + b = -1</text>

  <circle cx="290" cy="210" r="9" fill="#3b82c4"/>
  <circle cx="335" cy="250" r="9" fill="#3b82c4"/>
  <circle cx="375" cy="170" r="9" fill="#3b82c4"/>
  <circle cx="428" cy="220" r="13" fill="#3b82c4" stroke="#172033" stroke-width="3"/>

  <circle cx="650" cy="250" r="9" fill="#d96b6b"/>
  <circle cx="705" cy="210" r="9" fill="#d96b6b"/>
  <circle cx="745" cy="285" r="9" fill="#d96b6b"/>
  <circle cx="575" cy="270" r="13" fill="#d96b6b" stroke="#172033" stroke-width="3"/>

  <line x1="428" y1="220" x2="575" y2="270" class="guide"/>
  <text x="500" y="262" text-anchor="middle" class="label">마진 폭</text>
  <text x="358" y="146" text-anchor="middle" class="note">서포트 벡터</text>
  <text x="603" y="305" text-anchor="middle" class="note">서포트 벡터</text>
</svg>
