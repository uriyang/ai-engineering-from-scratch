<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="520" viewBox="0 0 1100 520" role="img" aria-labelledby="title desc"><title id="title">SMOTE: 이웃 사이의 보간</title><desc id="desc">소수 클래스 점 (1,2)와 (1.5,2.5) 사이의 40퍼센트 지점에 합성 점 (1.2,2.2)를 만든다.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#63758e"/></marker></defs><rect width="1100" height="520" fill="#f7f9fc"/><text x="550" y="43" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="27" font-weight="700" fill="#24334b">SMOTE: 이웃 사이의 보간</text><text x="550" y="83" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="19" font-weight="400" fill="#24334b">합성 샘플은 두 소수 클래스 이웃을 잇는 선분 위에 놓인다.</text><path d="M95,410 L650,410" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><path d="M95,410 L95,120" stroke="#63758e" stroke-width="2" fill="none" marker-end="url(#arrow)"/><text x="655" y="439" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="400" fill="#24334b">특징 1</text><text x="95" y="108" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="400" fill="#24334b">특징 2</text><path d="M205,330 L535,165" stroke="#4386c6" stroke-width="2" fill="none"/><circle cx="205" cy="330" r="10" fill="#4386c6"/><circle cx="535" cy="165" r="10" fill="#4386c6"/><circle cx="337" cy="264" r="11" fill="#ca5264"/><text x="205" y="365" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="400" fill="#24334b">x = (1.0, 2.0)</text><text x="535" y="140" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="400" fill="#24334b">이웃 = (1.5, 2.5)</text><text x="365" y="238" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="400" fill="#ad3a4c">합성 = (1.2, 2.2)</text><rect x="720" y="145" width="335" height="180" rx="12" fill="#fff2df" stroke="#c6d2e1"/><text x="887.5" y="214.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="600" fill="#24334b">x_new = x + λ (이웃 - x)</text><text x="887.5" y="241.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">λ = 0.4</text><text x="887.5" y="268.0" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="16" font-weight="400" fill="#24334b">두 점 사이 40% 지점</text><text x="885" y="370" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="17" font-weight="400" fill="#24334b">실제 새 관측을 얻은 것은 아니다.</text><text x="550" y="480" text-anchor="middle" font-family="Apple SD Gothic Neo,Noto Sans KR,Arial,sans-serif" font-size="18" font-weight="400" fill="#24334b">가정: 가까운 소수 클래스 사이의 중간점도 유효한 소수 클래스 샘플이다.</text></svg>