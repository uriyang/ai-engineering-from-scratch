<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="420" viewBox="0 0 1100 420">
  <defs>
    <style>
      .bg { fill: #faf7f2; }
      .title { fill: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 30px; font-weight: 700; }
      .sub { fill: #374151; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 20px; }
      .head { fill: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 700; }
      .row { fill: #1f2937; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 22px; font-weight: 600; }
      .cell { fill: #111827; font-family: "Menlo", "Consolas", monospace; font-size: 24px; }
      .grid { stroke: #9ca3af; stroke-width: 2; }
      .outer { stroke: #4b5563; stroke-width: 3; fill: none; }
      .unknown { fill: #6b7280; font-family: "Menlo", "Consolas", monospace; font-size: 24px; }
      .note { fill: #6b7280; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 18px; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1100" height="420"/>
  <text class="title" x="50" y="48">사용자-아이템 평점 행렬</text>
  <text class="sub" x="50" y="78">SVD는 이런 빈칸이 많은 행렬에서 숨은 취향 구조를 찾는다</text>

  <!-- table -->
  <rect class="outer" x="60" y="110" width="980" height="250" rx="8" ry="8"/>

  <!-- grid lines -->
  <line class="grid" x1="210" y1="110" x2="210" y2="360"/>
  <line class="grid" x1="360" y1="110" x2="360" y2="360"/>
  <line class="grid" x1="510" y1="110" x2="510" y2="360"/>
  <line class="grid" x1="660" y1="110" x2="660" y2="360"/>
  <line class="grid" x1="810" y1="110" x2="810" y2="360"/>
  <line class="grid" x1="60" y1="165" x2="1040" y2="165"/>
  <line class="grid" x1="60" y1="220" x2="1040" y2="220"/>
  <line class="grid" x1="60" y1="275" x2="1040" y2="275"/>
  <line class="grid" x1="60" y1="330" x2="1040" y2="330"/>

  <!-- headers -->
  <text class="head" x="255" y="145" text-anchor="middle">Movie1</text>
  <text class="head" x="405" y="145" text-anchor="middle">Movie2</text>
  <text class="head" x="555" y="145" text-anchor="middle">Movie3</text>
  <text class="head" x="705" y="145" text-anchor="middle">Movie4</text>
  <text class="head" x="855" y="145" text-anchor="middle">Movie5</text>

  <!-- row labels -->
  <text class="row" x="135" y="198" text-anchor="middle">User1</text>
  <text class="row" x="135" y="253" text-anchor="middle">User2</text>
  <text class="row" x="135" y="308" text-anchor="middle">User3</text>
  <text class="row" x="135" y="363" text-anchor="middle">User4</text>

  <!-- values -->
  <text class="cell" x="255" y="198" text-anchor="middle">5</text>
  <text class="unknown" x="405" y="198" text-anchor="middle">?</text>
  <text class="cell" x="555" y="198" text-anchor="middle">3</text>
  <text class="unknown" x="705" y="198" text-anchor="middle">?</text>
  <text class="cell" x="855" y="198" text-anchor="middle">1</text>

  <text class="unknown" x="255" y="253" text-anchor="middle">?</text>
  <text class="cell" x="405" y="253" text-anchor="middle">4</text>
  <text class="unknown" x="555" y="253" text-anchor="middle">?</text>
  <text class="cell" x="705" y="253" text-anchor="middle">2</text>
  <text class="unknown" x="855" y="253" text-anchor="middle">?</text>

  <text class="cell" x="255" y="308" text-anchor="middle">3</text>
  <text class="unknown" x="405" y="308" text-anchor="middle">?</text>
  <text class="cell" x="555" y="308" text-anchor="middle">5</text>
  <text class="unknown" x="705" y="308" text-anchor="middle">?</text>
  <text class="unknown" x="855" y="308" text-anchor="middle">?</text>

  <text class="unknown" x="255" y="363" text-anchor="middle">?</text>
  <text class="unknown" x="405" y="363" text-anchor="middle">?</text>
  <text class="unknown" x="555" y="363" text-anchor="middle">?</text>
  <text class="cell" x="705" y="363" text-anchor="middle">4</text>
  <text class="cell" x="855" y="363" text-anchor="middle">3</text>

  <text class="note" x="60" y="392">? = unknown rating</text>
</svg>
