<svg xmlns="http://www.w3.org/2000/svg" width="900" height="320" viewBox="0 0 900 320" role="img" aria-labelledby="title desc">
  <title id="title">볼록 함수와 비볼록 함수 비교</title>
  <desc id="desc">볼록 함수와 비볼록 함수의 최적화 차이를 비교한다.</desc>
  <rect width="900" height="320" fill="#f7f8fb"/>
