  <g font-family="Apple SD Gothic Neo, Noto Sans KR, Arial, sans-serif">
    <rect x="70" y="82" width="330" height="178" rx="8" fill="#eef7ff" stroke="#3b82c4" stroke-width="2"/>
    <text x="235" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#172033">볼록 함수</text>
    <path d="M120 218 C165 122, 300 122, 350 218" fill="none" stroke="#2563a8" stroke-width="5"/>
