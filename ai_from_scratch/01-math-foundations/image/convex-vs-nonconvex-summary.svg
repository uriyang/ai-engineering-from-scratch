    <rect x="500" y="82" width="330" height="178" rx="8" fill="#fff3ef" stroke="#d36b45" stroke-width="2"/>
    <text x="665" y="118" text-anchor="middle" font-size="24" font-weight="700" fill="#172033">비볼록 함수</text>
